name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
      # A senha da Conversa não pode aparecer em nenhum arquivo versionado nem no dist (tests/senha-fora.test.ts).
      - run: npm test
        env:
          KOTOBA_SENHA: ${{ secrets.KOTOBA_SENHA }}
      - run: npm run e2e
      # Porteiro do servidor da IA do PC (CORS e acesso à rede local): só biblioteca padrão do Python.
      - run: python3 -I -m unittest discover -s local -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 1

  # O site mora na Cloudflare Pages (kotoba-arcade.pages.dev), com as rotas /api da Conversa (functions/).
  cloudflare:
    needs: testar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name kotoba-arcade --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # O endereço antigo (GitHub Pages) só redireciona para a Cloudflare, levando o save de quem jogava lá.
  # Vem depois da Cloudflare: se a publicação lá falhar, o endereço antigo não aponta para um site quebrado.
  github-pages:
    needs: [testar, cloudflare]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-de-novo.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Um nome por tentativa: ao rodar o job de novo, o pacote da tentativa anterior continua na run,
      # e dois pacotes com o mesmo nome fazem o deploy-pages falhar (tests/workflow.test.ts).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/github-pages
          name: github-pages-${{ github.run_attempt }}
      # O deploy-pages às vezes procura o pacote no mesmo segundo em que ele foi criado e não acha
      # ("No artifacts named github-pages-N", com o pacote lá). Espera um pouco e tenta de novo.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy-de-novo
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
