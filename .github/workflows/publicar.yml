name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
      # A senha da Conversa não pode aparecer em nenhum arquivo versionado nem no dist (tests/senha-fora.test.ts).
      - run: npm test
        env:
          KOTOBA_SENHA: ${{ secrets.KOTOBA_SENHA }}
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 1

  # O site mora na Cloudflare Pages (kotoba-arcade.pages.dev), com as rotas /api da Conversa (functions/).
  cloudflare:
    needs: testar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name kotoba-arcade --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # O endereço antigo (GitHub Pages) só redireciona para a Cloudflare, levando o save de quem jogava lá.
  # Vem depois da Cloudflare: se a publicação lá falhar, o endereço antigo não aponta para um site quebrado.
  github-pages:
    needs: [testar, cloudflare]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/github-pages
      - id: deploy
        uses: actions/deploy-pages@v4
